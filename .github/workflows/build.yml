name: Build Synkk Executable

# Pushes to main only build the installer and attach it to the run for testing.
# Publishing to synkk-downloads (which every installed Synkk auto-updates from)
# only happens when the workflow is run manually with "publish" ticked.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build to synkk-downloads (every pharmacy auto-updates to it)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./Synkk
        run: npm install

      - name: Build installer (not published)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        working-directory: ./Synkk
        run: npm run package

      - name: Build and publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        working-directory: ./Synkk
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synkk-Windows-Installer
          path: ./Synkk/dist-electron/**/*.exe
