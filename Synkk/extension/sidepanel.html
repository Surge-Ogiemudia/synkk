<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmastackX Sourcing Cockpit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0b0f17;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0b0f17;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #0b0f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 12px;
      transition: opacity 0.3s ease-out;
      z-index: 10;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 212, 170, 0.2);
      border-top-color: #00d4aa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <span>Connecting to PharmastackX Cockpit...</span>
  </div>
  <iframe id="appFrame" src="about:blank" allow="clipboard-read; clipboard-write;"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
